server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/auth/**

            - id: user-service-public
              uri: lb://user-service
              predicates:
                - Path=/api/v1/users/signup, /api/v1/users/check-login-credentials
                - Method=POST

            - id: user-service-authenticated
              uri: lb://user-service
              predicates:
                - Path=/api/v1/users/**
              filters:
                - name: AuthenticationFilter

            - id: quiz-service
              uri: lb://quiz-service
              predicates:
                - Path=/api/v1/quiz/**
              filters:
                - name: AuthenticationFilter

eureka:
    client:
        register-with-eureka: true
        fetch-registry: true
        service-url:
            defaultZone: http://eureka-server:8761/eureka
    instance:
        prefer-ip-address: true
        hostname: gateway
