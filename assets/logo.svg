<svg width="200" height="200" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">

    <!-- Gradient and Font Definitions -->
    <defs>
        <style type="text/css">
            @font-face {
                font-family: 'TMoneyDungunbaram';
                src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-07@1.0/TmoneyRoundWindExtraBold.woff') format('woff');
                font-weight: 800;
                font-display: swap;
            }

            /* Default text color for Light Mode */
            .logo-text {
                fill: #1f2937; /* 기본 색상을 검은색으로 설정 */
            }

            /* Text color for Dark Mode */
            @media (prefers-color-scheme: dark) {
                .logo-text {
                    fill: #ffffff; /* 다크 모드일 때 흰색으로 변경 */
                }
            }
        </style>
        <linearGradient id="barGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#10b981;"></stop>
            <stop offset="100%" style="stop-color:#3b82f6;"></stop>
        </linearGradient>
    </defs>

    <!-- Logo Symbol Group: 로고 심볼(바 3개)을 그룹화합니다. -->
    <g>
        <!-- Bar 1 (Left) -->
        <rect x="0" y="50" width="26" height="50" rx="13" fill="#3b82f6">
            <animate attributeName="height" values="50;100;50" dur="1.5s" begin="0s" repeatCount="indefinite"></animate>
            <animate attributeName="y" values="50;0;50" dur="1.5s" begin="0s" repeatCount="indefinite"></animate>
        </rect>

        <!-- Bar 2 (Center) -->
        <rect x="37" y="0" width="26" height="100" rx="13" fill="url(#barGradient)">
            <animate attributeName="height" values="50;100;50" dur="1.5s" begin="0.2s" repeatCount="indefinite"></animate>
            <animate attributeName="y" values="50;0;50" dur="1.5s" begin="0.2s" repeatCount="indefinite"></animate>
        </rect>

        <!-- Bar 3 (Right) -->
        <rect x="74" y="20" width="26" height="80" rx="13" fill="#3b82f6">
            <animate attributeName="height" values="50;100;50" dur="1.5s" begin="0.4s" repeatCount="indefinite"></animate>
            <animate attributeName="y" values="50;0;50" dur="1.5s" begin="0.4s" repeatCount="indefinite"></animate>
        </rect>
    </g>

    <!-- Logo Text: 로고 텍스트 'weave'를 추가합니다. -->
    <text x="50" y="135" class="logo-text" font-family="TMoneyDungunbaram, sans-serif" font-weight="800" font-size="32" letter-spacing="-1.5" text-anchor="middle">
          weave
    </text>

</svg>
