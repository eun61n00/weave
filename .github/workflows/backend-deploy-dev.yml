name: Deploy Backend to Oracle Cloud (Dev)

on:
  push:
    branches: ["dev", "feat/*"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and Push Docker Images
        run: |
          export GIT_TAG=${{ github.sha }}
          export DOCKER_USER=${{ secrets.DOCKER_HUB_USERNAME }}
          docker compose -f docker-compose.yml build
          docker compose -f docker-compose.yml push

      - name: Copy docker-compose.prod.yml to Oracle Server
        run: |
          echo "${{ secrets.ORACLE_KEY }}" > key.pem
          chmod 600 key.pem
          scp -i key.pem -o StrictHostKeyChecking=no docker-compose.prod.yml ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }}:/home/ubuntu/weave/

      - name: Deploy to Oracle Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_KEY }}
          script: |
            cd /home/ubuntu/weave
            export GIT_TAG=${{ github.sha }}
            echo "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin
            echo "🐳 Stopping existing containers..."
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml pull
            echo "🚀 Building and running new images..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            echo "✨ Deployment completed!"
